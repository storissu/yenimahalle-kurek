# Netlify build settings (free plan). The security headers come from web/public/_headers (same file format as
# Cloudflare Pages) and the single-page-app fallback from web/public/_redirects; nothing is duplicated here.
# Environment variables (VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY, ...) are set in the Netlify dashboard, see docs/RUNBOOK.md.

[build]
  base = "web"
  command = "npm ci && npm run build"
  publish = "dist"
  # Free plans have a monthly build allowance: skip the build when nothing inside web/ changed (docs, database, ...).
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."

[build.environment]
  NODE_VERSION = "22"
